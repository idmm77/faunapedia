# gradle.properties — variables centrales du build, réutilisées par build.gradle et neoforge.mods.toml.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Versions Minecraft / NeoForge ---
minecraft_version=1.21.1
# Dernière version stable de NeoForge pour Minecraft 1.21.1 (au 2026-07-15).
neo_version=21.1.236
# Plage de versions NeoForge acceptée par le mod à l'exécution.
neo_version_range=[21.1,)
# Plage de versions du loader FML acceptée.
loader_version_range=[4,)
# Version de JEI dont l'API sert à la compilation (doit correspondre au jar de run/mods).
# JEI reste FACULTATIF à l'exécution : le mod fonctionne sans lui.
jei_version=19.39.0.369

# --- Identité du mod ---
mod_id=faunapedia
mod_name=FaunaPedia
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.strangevalley.faunapedia
mod_authors=StrangeValley
# Pas de mod_description ici : la description vit en littéral dans neoforge.mods.toml. gradle.properties
# est lu en ISO-8859-1, un accent y serait corrompu dans le jar.
